<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Oficina Mecânica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <style>
        body {
            /* Transparent background for the window */
            background: transparent;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .login-card {
            width: 100%;
            height: 100%;
            /* Fill the window */
            padding: 0;
            border-radius: 10px;
            /* Optional if window is transparent */
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            background: white;
            display: flex;
            flex-direction: column;
            border: 1px solid #e0e0e0;
        }

        .window-controls {
            display: flex;
            justify-content: flex-end;
            padding: 5px 10px;
            /* Allow dragging the window via this header */
            -webkit-app-region: drag;
        }

        .control-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px 10px;
            color: #6c757d;
            transition: color 0.2s;
            /* Important: Buttons must be clickable, not draggable */
            -webkit-app-region: no-drag;
        }

        .control-btn:hover {
            color: #000;
        }

        .control-btn.close-btn:hover {
            color: #dc3545;
        }

        .login-content {
            padding: 1rem 3rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-header {
            text-align: center;
            margin-bottom: 1rem;
        }

        .login-header i {
            font-size: 3.5rem;
            color: #61a354;
        }

        /* Input styling adjustments */
        .form-control:focus {
            border-color: #61a354;
            box-shadow: 0 0 0 0.25rem rgba(97, 163, 84, 0.25);
        }

        .btn-primary {
            background-color: #61a354;
            border-color: #61a354;
        }

        .btn-primary:hover {
            background-color: #4e8542;
            border-color: #4e8542;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <!-- Custom Title Bar / Controls -->
        <div class="window-controls">
            <button class="control-btn" id="btn-minimize" title="Minimizar">
                <i class="bi bi-dash-lg"></i>
            </button>
            <button class="control-btn close-btn" id="btn-close" title="Fechar">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>

        <div class="login-content">
            <div class="login-header">
                <i class="bi bi-gear-wide-connected"></i>
                <h3 class="mt-3">Oficina Mecânica</h3>
                <p class="text-muted">Faça login para continuar</p>
            </div>

            <form id="login-form">
                <div class="mb-3">
                    <label for="username" class="form-label">Usuário</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="username" required autofocus>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Senha</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" required>
                    </div>
                </div>

                <div id="error-message" class="alert alert-danger d-none py-2 text-center" role="alert"></div>

                <button type="submit" class="btn btn-primary w-100 py-2 mt-2">
                    Entrar <i class="bi bi-box-arrow-in-right ms-2"></i>
                </button>
            </form>
            <div class="text-center mt-3">
                <small class="text-muted" id="app-version">Versão ...</small>
            </div>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('login-form');
        const errorMsg = document.getElementById('error-message');
        const usernameInput = document.getElementById('username');

        // Window Controls
        document.getElementById('btn-minimize').addEventListener('click', () => {
            if (window.api && window.api.minimizeApp) window.api.minimizeApp();
        });

        document.getElementById('btn-close').addEventListener('click', () => {
            if (window.api && window.api.closeApp) window.api.closeApp();
        });

        // Ensure focus on load
        window.addEventListener('load', async () => {
            if (usernameInput) {
                setTimeout(() => usernameInput.focus(), 100);
            }
            if (window.api && window.api.getAppVersion) {
                try {
                    const ver = await window.api.getAppVersion();
                    document.getElementById('app-version').textContent = `Versão ${ver}`;
                } catch (e) { console.error(e); }
            }
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.classList.add('d-none');

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                if (!window.api || !window.api.login) {
                    throw new Error("API de login não disponível.");
                }

                // The backend main.js will handle window switching on success
                const result = await window.api.login({ username, password });

                if (result.success) {
                    // No need to redirect manually, the window changes
                } else {
                    errorMsg.textContent = result.message;
                    errorMsg.classList.remove('d-none');
                }

            } catch (error) {
                console.error(error);
                errorMsg.textContent = "Erro ao conectar com o sistema.";
                errorMsg.classList.remove('d-none');
            }
        });
    </script>
</body>

</html>
